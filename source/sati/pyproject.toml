[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sati-standalone"
version = "0.1.0rc8"
description = "Self-contained harmonic and anharmonic vibronic spectroscopy"
requires-python = ">=3.11"
dependencies = [
  "matrix-trinity[spectroscopy,zaff-anharmonic]==0.1.0rc8",
  "matrix-apoc==0.1.0rc8", "matrix-orca==0.1.0rc8",
  "matrix-architect==0.1.0rc8",
]

[project.scripts]
sati = "sati.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
